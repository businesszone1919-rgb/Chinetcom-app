<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinet Com Logistics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1c4587; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 10px; color: white; }
        .container { width: 100%; max-width: 400px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); padding: 20px 10px; border-radius: 15px; color: white; font-size: 15px; cursor: pointer; text-align: center; }
        .choice-card { background: white; padding: 25px; border-radius: 25px; display: none; text-align: center; color: #333; }
        .choice-card h2 { font-size: 24px; margin-bottom: 20px; color: #333; }
        .choice-btn { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: white; line-height: 1.4; }
        .btn-orange { background-color: #f39c12; }
        .btn-blue { background-color: #2980b9; }
        .btn-red { background-color: #e74c3c; width: 100%; padding: 12px; border-radius: 10px; margin-top: 10px; color: white; border: none; font-size: 16px; }
        .card { background: white; padding: 20px; border-radius: 20px; display: none; color: #333; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; position: relative; }
        .footer-section { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; text-align: center; margin-top: 20px; }
        .footer-section p { font-size: 14px; margin-bottom: 10px; }
        .link-flex { display: flex; gap: 10px; }
        .link-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 12px; text-decoration: none; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .link-chan { background: #0088cc; }
        .link-grp { background: #3498db; }
        #toast { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainMenu">
            <div class="menu-grid">
                <div class="menu-btn" onclick="showChoice()">📝 Register<br>(መመዝገብ)</div>
                <div class="menu-btn" onclick="copyInviteLink()">🔗 Invite<br>(ጋብዝ)</div>
                <div class="menu-btn" onclick="showToast('መመሪያ፡ መጀመሪያ Register የሚለውን ይጫኑ።')">📖 Help</div>
                <div class="menu-btn" onclick="location.reload()">🔄 Start<br>(እንደገና)</div>
            </div>
            <div class="footer-section">
                <p>ጭነት ወይም መኪና ለማግኘት ይቀላቀሉ</p>
                <div class="link-flex">
                    <a href="https://t.me/chinetcom" class="link-btn link-chan">📢 Join Channel</a>
                    <a href="https://t.me/chinetcometh" class="link-btn link-grp">👥 Join Group</a>
                </div>
            </div>
        </div>

        <div id="choicePage" class="choice-card">
            <h2>ምን መመዝገብ ይፈልጋሉ?</h2>
            <button class="choice-btn btn-orange" onclick="openForm('load')">📦 መኪና እፈልጋለሁ<br>(የሚጫን ጭነት አለኝ)</button>
            <button class="choice-btn btn-blue" onclick="openForm('truck')">🚛 ጭነት እፈልጋለሁ<br>(መኪና/ትራንስፖርት አለኝ)</button>
            <button class="btn-red" onclick="showHome()">ተመለስ</button>
        </div>

        <div id="loadForm" class="card">
            <h2 style="text-align:center">📦 የጭነት ዝርዝር</h2>
            <input type="text" id="org" placeholder="የባለቤት ስም">
            <input type="tel" id="phone" placeholder="ስልክ ቁጥር (10 ዲጂት)" maxlength="10">
            <input type="text" id="from" placeholder="📍 የጭነት መነሻ">
            <input type="text" id="to" placeholder="🏁 የጭነት መድረሻ">
            <input type="text" id="cargo" placeholder="📦 አይነት">
            <input type="text" id="amount" placeholder="⚖️ መጠን">
            <input type="text" id="price" placeholder="💰 ዋጋ">
            <input type="date" id="date">
            <button class="submit-btn" id="loadSubmitBtn" onclick="submitData('load')">ለአድሚን ላክ</button>
            <button class="btn-red" onclick="showChoice()">ተመለስ</button>
        </div>

        <div id="truckForm" class="card">
            <h2 style="text-align:center">🚛 የመኪና ዝርዝር</h2>
            <input type="text" id="vType" placeholder="🚛 የመኪና አይነት">
            <input type="text" id="plate" placeholder="🔢 ታርጋ">
            <input type="text" id="currentCity" placeholder="📍 መኪናው ያለበት ቦታ">
            <input type="text" id="toCity" placeholder="🏁 መድረሻ">
            <input type="text" id="driverName" placeholder="👤 የአሽከርካሪ ስም">
            <input type="tel" id="driverPhone" placeholder="📞 ስልክ ቁጥር" maxlength="10">
            <button class="submit-btn" id="truckSubmitBtn" onclick="submitData('truck')">ለአድሚን ላክ</button>
            <button class="btn-red" onclick="showChoice()">ተመለስ</button>
        </div>
    </div>

    <div id="toast">መልእክት</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function showHome() { hideAll(); document.getElementById('mainMenu').style.display = 'block'; }
        function showChoice() { hideAll(); document.getElementById('choicePage').style.display = 'block'; }
        function openForm(type) { hideAll(); document.getElementById(type + 'Form').style.display = 'block'; }
        function hideAll() { 
            document.getElementById('mainMenu').style.display = 'none'; 
            document.getElementById('choicePage').style.display = 'none';
            document.getElementById('loadForm').style.display = 'none';
            document.getElementById('truckForm').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function copyInviteLink() {
            navigator.clipboard.writeText("https://t.me/chinetcombot");
            showToast("የመጋበዣ ሊንኩ ተገልብጧል!");
        }

        async function submitData(type) {
            const phoneVal = type === 'load' ? document.getElementById('phone').value : document.getElementById('driverPhone').value;
            if(phoneVal.length !== 10) {
                showToast("እባክዎ ትክክለኛ 10 ዲጂት ስልክ ያስገቡ!");
                return;
            }

            const btn = document.getElementById(type + 'SubmitBtn');
            btn.disabled = true;
            btn.innerText = "በመላክ ላይ...";

            // 1. ለአድሚኑ የሚታየው ሙሉ መረጃ (Admin Preview)
            let admin_data = "";
            // 2. ቻናል ላይ የሚለጠፈው የተቀነሰ መረጃ (Channel Post)
            let channel_post = "";

            if(type === 'load') {
                const org = document.getElementById('org').value;
                const from = document.getElementById('from').value;
                const to = document.getElementById('to').value;
                const cargo = document.getElementById('cargo').value;
                const amount = document.getElementById('amount').value;
                const price = document.getElementById('price').value;
                const date = document.getElementById('date').value;

                admin_data = `🚚 አዲስ የጭነት ጥያቄ\n📍 መነሻ: ${from}\n🏁 መድረሻ: ${to}\n📦 አይነት: ${cargo}\n⚖️ መጠን: ${amount}\n💰 ዋጋ: ${price}\n📅 ቀን: ${date}\n👤 ባለቤት: ${org}\n📞 ስልክ: ${phoneVal}`;
                
                channel_post = `🚚 አዲስ የጭነት ጥያቄ\n📍 መነሻ: ${from}\n🏁 መድረሻ: ${to}\n📦 አይነት: ${cargo}\n⚖️ መጠን: ${amount}\n💰 ዋጋ: ${price}\n📅 ቀን: ${date}\n\nℹ️ ለመጫን በቦታችን @chinetcombot በኩል ይጠይቁ።`;
            } else {
                const vType = document.getElementById('vType').value;
                const plate = document.getElementById('plate').value;
                const city = document.getElementById('currentCity').value;
                const toCity = document.getElementById('toCity').value;
                const driver = document.getElementById('driverName').value;

                admin_data = `🚛 አዲስ የመኪና ምዝገባ\n🚛 አይነት: ${vType}\n🔢 ታርጋ: ${plate}\n📍 ያለበት: ${city}\n🏁 መድረሻ: ${toCity}\n👤 ሹፌር: ${driver}\n📞 ስልክ: ${phoneVal}`;
                
                channel_post = `🚛 አዲስ የመኪና ምዝገባ\n🚛 አይነት: ${vType}\n📍 ያለበት: ${city}\n🏁 መድረሻ: ${toCity}\n\nℹ️ ጭነት ለማግኘት በቦታችን @chinetcombot በኩል ይጠይቁ።`;
            }

            // ቦቱ በቀላሉ እንዲለይ payload እናዘጋጃለን
            let payload = {
                action: "admin_review",
                admin_text: admin_data,      // ለአድሚን የሚላክ
                public_text: channel_post,    // አድሚኑ ሲያጸድቅ የሚለጠፍ
                user_id: tg.initDataUnsafe?.user?.id
            };

            try {
                // ዳታውን ለቦቱ እንልካለን
                tg.sendData(JSON.stringify(payload)); 
                showToast("መረጃው ለአድሚን ተልኳል!");
                setTimeout(() => tg.close(), 2000);
            } catch (e) {
                showToast("ስህተት ተፈጥሯል!");
                btn.disabled = false;
                btn.innerText = "ለአድሚን ላክ";
            }
        }
    </script>
</body>
</html>
