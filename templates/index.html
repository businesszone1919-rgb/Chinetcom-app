<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinet Com Logistics</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5af19, #f12711); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 15px; }
        .container { width: 100%; max-width: 450px; }
        
        /* የሜኑ ዲዛይን */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.3); padding: 25px 10px; border-radius: 15px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-3px); }
        .menu-btn span { display: block; font-size: 30px; margin-bottom: 10px; }

        /* የፎርም ካርድ */
        .card { background: white; padding: 20px; border-radius: 20px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .back-btn { background: #6c757d; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainMenu" class="menu-grid">
            <div class="menu-btn" onclick="showForm()">
                <span>📝</span> Register (መዝግብ)
            </div>
            <div class="menu-btn" onclick="copyInviteLink()">
                <span>🔗</span> Invite (ጋብዝ)
            </div>
            <div class="menu-btn" onclick="alert('መመሪያ፡ እዚህ ጋር የአጠቃቀም መመሪያ መጻፍ ትችላለህ')">
                <span>📖</span> Instruction
            </div>
            <div class="menu-btn" onclick="location.reload()">
                <span>🔄</span> Start (እንደገና)
            </div>
        </div>

        <div id="registrationForm" class="card">
            <h2>🚚 የጭነት ጥያቄ ማቅረቢያ</h2>
            <input type="text" id="org" placeholder="የባለቤት ወይም የድርጅት ስም">
            <input type="tel" id="phone" placeholder="የስልክ ቁጥር"> 
            <input type="text" id="from" placeholder="መነሻ ቦታ">
            <input type="text" id="to" placeholder="መድረሻ ቦታ">
            <input type="text" id="cargo" placeholder="የጭነቱ አይነት">
            <input type="text" id="amount" placeholder="መጠን (ኩንታል/ቶን)">
            <select id="truckType">
                <option value="">የሚፈለገው መኪና አይነት</option>
                <option value="አይሱዙ">አይሱዙ</option>
                <option value="FSR">FSR</option>
                <option value="ሲኖትራክ">ሲኖትራክ</option>
            </select>
            <input type="text" id="price" placeholder="የሚከፈል ዋጋ/ታሪፍ">
            <input type="text" id="date" placeholder="የመጫኛ ቀን">
            
            <button class="submit-btn" onclick="submitLoad()">ጥያቄውን ላክ</button>
            <button class="submit-btn back-btn" onclick="showMenu()">ወደ ኋላ ተመለስ</button>
        </div>
    </div>

    <script>
        // ሜኑውን እና ፎርሙን መቀያየሪያ
        function showForm() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('registrationForm').style.display = 'block';
        }

        function showMenu() {
            document.getElementById('registrationForm').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'grid';
        }

        function copyInviteLink() {
            const url = window.location.href;
            navigator.clipboard.writeText("Chinet Com ላይ ለመመዝገብ ይህንን ሊንክ ይጠቀሙ፡ " + url);
            alert("የመጋበዣ ሊንኩ ኮፒ ተደርጓል!");
        }

        async function submitLoad() {
            const data = {
                type: 'load',
                org: document.getElementById('org').value,
                phone: document.getElementById('phone').value,
                from: document.getElementById('from').value,
                to: document.getElementById('to').value,
                cargo: document.getElementById('cargo').value,
                amount: document.getElementById('amount').value,
                truckType: document.getElementById('truckType').value,
                price: document.getElementById('price').value,
                date: document.getElementById('date').value
            };

            if(!data.phone || !data.from) {
                alert("እባክዎ ስልክ እና መነሻ ቦታ ይሙሉ!");
                return;
            }

            try {
                const resp = await fetch('/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const res = await resp.json();
                alert(res.message);
                if(res.status === 'success') showMenu();
            } catch (e) {
                alert("ስህተት ተከስቷል!");
            }
        }
    </script>
</body>
</html>
